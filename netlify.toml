[build]
  base = ""
  command = "git clone https://github.com/flutter/flutter.git --branch stable --depth 1 flutter && flutter/bin/flutter config --enable-web && flutter/bin/flutter pub get && flutter/bin/flutter build web --release --dart-define=BACKEND_URL=${BACKEND_URL:-https://stark-vms-backend.onrender.com/api} --web-renderer canvaskit"
  publish = "build/web"

[build.environment]
  BACKEND_URL = "https://stark-vms-backend.onrender.com/api"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
